services:
  index-bridge:
    build: .
    container_name: index-bridge
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - outbox-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    stop_grace_period: 10s

volumes:
  outbox-data:
